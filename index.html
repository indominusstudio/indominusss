<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dino Promo Shopee</title>

<style>
:root {
  --bg:#f5f5f5;
  --text:#111;
  --card:white;
}
body.dark {
  --bg:#111;
  --text:#eee;
  --card:#1e1e1e;
}
body {
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}
header {
  background:#00ff88;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.container { padding:20px; }
.card {
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}
.btn-loja {
  position:fixed;
  top:15px;
  right:15px;
  background:#00ff88;
  padding:10px 15px;
  border-radius:20px;
  color:black;
  text-decoration:none;
  font-weight:bold;
}
.anuncio {
  display:flex;
  gap:20px;
  align-items:center;
}
.anuncio img {
  width:220px;
  border-radius:10px;
}
.profile {
  display:flex;
  gap:15px;
  align-items:center;
}
.profile img {
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
}
.rank-item {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}
.rank-item img {
  width:40px;
  height:40px;
  border-radius:50%;
}
</style>
</head>

<body>

<header>
  <strong>🦖 Dino Promo Shopee</strong>
  <button onclick="toggleTheme()">🌗</button>
</header>

<a href="#loja" class="btn-loja">🛒 Loja</a>

<div class="container">

<!-- TELA INICIAL -->
