<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dino Promo Shopee</title>

<style>
:root{
  --bg:#0f172a;
  --card:#020617;
  --text:#e5e7eb;
  --accent:#22c55e;
}
.light{
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#020617;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--card);
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav button{
  margin-left:6px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--accent);
  color:black;
}
section{
  padding:20px;
}
.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.hidden{display:none}
.rank-item{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.rank-item img,
.profile-img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}
.profile-big{
  width:100px;
  height:100px;
  border-radius:50%;
}
input{
  padding:8px;
  width:100%;
  margin-bottom:8px;
  border-radius:6px;
  border:1px solid #999;
}
a{color:var(--accent)}
</style>
</head>

<body>

<header>
  <strong>🦖 Dino Promo Shopee</strong>
  <nav>
    <button onclick="show('home')">Home</button>
    <button onclick="show('loja')">Loja</button>
    <button onclick="show('perfil')">Perfil</button>
    <button onclick="show('config')">⚙️</button>
  </nav>
</header>

<!-- HOME -->
<section id="home">
  <div class="card">
    <h2>Bem-vindo 👋</h2>
    <p>Promoções de dinossauros da Shopee.</p>
  </div>

  <div class="card">
    <h3>Mosassauro</h3>
    <img src="mosassauro.jpg" width="260">
    <p>Esse é o mosassauro que eu comprei.</p>
  </div>

  <div class="card">
    <h3>🏆 Rank</h3>
    <div id="rank"></div>
  </div>
</section>

<!-- LOJA -->
<section id="loja" class="hidden">
  <div class="card">
    <h3>🛒 Enviar link</h3>
    <input id="linkInput" placeholder="Link Shopee ou vídeo">
    <button onclick="addLink()">Salvar</button>
    <ul id="links"></ul>
  </div>
</section>

<!-- PERFIL -->
<section id="perfil" class="hidden">
  <div class="card">
    <h3>👤 Perfil</h3>
    <img id="profileImg" src="default-profile.png" class="profile-big"><br><br>
    <input id="nameInput" placeholder="Seu nome">
    <input id="photoInput" placeholder="Link da foto (opcional)">
    <button onclick="saveProfile()">Salvar Perfil</button>
  </div>
</section>

<!-- CONFIG -->
<section id="config" class="hidden">
  <div class="card">
    <h3>⚙️ Configurações</h3>
    <button onclick="toggleTheme()">🌗 Modo claro / escuro</button><br><br>
    <button onclick="resetData()">🗑️ Apagar dados locais</button>
  </div>
</section>

<script>
let users = JSON.parse(localStorage.getItem("users")||"[]");
let links = JSON.parse(localStorage.getItem("links")||"[]");

function show(id){
  ["home","loja","perfil","config"].forEach(s=>{
    document.getElementById(s).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function saveProfile(){
  const name = nameInput.value;
  const photo = photoInput.value || "default-profile.png";
  if(!name) return alert("Digite um nome");
  users.push({name,photo});
  localStorage.setItem("users",JSON.stringify(users));
  profileImg.src = photo;
  loadRank();
  alert("Perfil salvo!");
}

function loadRank(){
  rank.innerHTML="";
  users.forEach(u=>{
    const div=document.createElement("div");
    div.className="rank-item";
    div.innerHTML=`<img src="${u.photo}"> ${u.name}`;
    rank.appendChild(div);
  });
}

function addLink(){
  if(!linkInput.value) return;
  links.push(linkInput.value);
  localStorage.setItem("links",JSON.stringify(links));
  renderLinks();
  linkInput.value="";
}

function renderLinks(){
  links.forEach(l=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${l}" target="_blank">${l}</a>`;
    document.getElementById("links").appendChild(li);
  });
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function resetData(){
  if(confirm("Apagar tudo?")){
    localStorage.clear();
    location.reload();
  }
}

loadRank();
renderLinks();
</script>

</body>
</html>
