<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dino Promo</title>

<style>
:root{
  --bg:#0f172a;
  --card:#020617;
  --text:#e5e7eb;
  --accent:#22c55e;
}
.light{
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#020617;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:var(--card);
  padding:12px;
}
.top{
  display:flex;
  gap:10px;
  align-items:center;
}
input,button{
  padding:8px;
  border-radius:6px;
  border:none;
}
input{flex:1}
button{
  background:var(--accent);
  cursor:pointer;
}
nav{
  margin-top:10px;
  display:flex;
  gap:6px;
}
section{padding:20px}
.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
.hidden{display:none}
img{
  object-fit:cover;
}
.rank-item{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
}
.rank-item img{width:40px;height:40px;border-radius:50%}
.profile-big{width:120px;height:120px;border-radius:50%}
a{color:var(--accent)}
</style>
</head>

<body>

<header>
  <div class="top">
    <strong>🦖 Dino Promo</strong>
    <input id="search" placeholder="Pesquisar dinossauro..." oninput="searchGlobal()">
  </div>
  <nav>
    <button onclick="show('home')">Home</button>
    <button onclick="show('loja')">Loja</button>
    <button onclick="show('perfil')">Perfil</button>
    <button onclick="show('config')">⚙️</button>
  </nav>
</header>

<!-- HOME -->
<section id="home">
  <div class="card">
    <h3>Mosassauro</h3>
    <img src="mosassauro.jpg" width="240" style="border-radius:12px">
    <p>Esse é o mosassauro que eu comprei.</p>
  </div>

  <div class="card">
    <h3>🏆 Rank</h3>
    <div id="rank"></div>
  </div>
</section>

<!-- LOJA -->
<section id="loja" class="hidden">
  <div class="card">
    <h3>🛒 Adicionar link (verificado 🤖)</h3>
    <input id="dinoName" placeholder="Nome do dinossauro">
    <input id="linkInput" placeholder="Link da loja">
    <button onclick="addLink()">Enviar</button>
  </div>
</section>

<!-- PERFIL -->
<section id="perfil" class="hidden">
  <div class="card">
    <h3>👤 Perfil</h3>
    <img id="profileImg" src="default-profile.png" class="profile-big"><br><br>
    <input id="nameInput" placeholder="Seu nome">
    <input type="file" id="photoFile" accept="image/*">
    <button onclick="saveProfile()">Salvar Perfil</button>
  </div>

  <div class="card">
    <h3>📎 Meus links</h3>
    <ul id="myLinks"></ul>
  </div>
</section>

<!-- CONFIG -->
<section id="config" class="hidden">
  <div class="card">
    <h3>⚙️ Configurações</h3>
    <button onclick="toggleTheme()">🌗 Modo claro / escuro</button><br><br>
    <button onclick="resetData()">🗑️ Apagar tudo</button>
  </div>
</section>

<script>
/* ===== IA DE VALIDAÇÃO DE LOJAS ===== */
const allowedStores = [
  "shopee.",
  "amazon.",
  "mercadolivre.",
  "aliexpress.",
  "magazineluiza."
];

function isValidStoreLink(link){
  return allowedStores.some(store => link.includes(store));
}

/* ===== DADOS ===== */
let profile = JSON.parse(localStorage.getItem("profile")||"null");
let users = JSON.parse(localStorage.getItem("users")||"[]");
let links = JSON.parse(localStorage.getItem("links")||"[]");

/* ===== NAVEGAÇÃO ===== */
function show(id){
  ["home","loja","perfil","config"].forEach(s=>{
    document.getElementById(s).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* ===== PERFIL ===== */
function saveProfile(){
  const name = nameInput.value;
  const file = photoFile.files[0];
  if(!name) return alert("Digite um nome");

  if(file){
    const reader = new FileReader();
    reader.onload = () => {
      profile={name,photo:reader.result};
      localStorage.setItem("profile",JSON.stringify(profile));
      addUser(profile);
    };
    reader.readAsDataURL(file);
  }else{
    profile={name,photo:"default-profile.png"};
    localStorage.setItem("profile",JSON.stringify(profile));
    addUser(profile);
  }
}

function addUser(p){
  users.push(p);
  localStorage.setItem("users",JSON.stringify(users));
  profileImg.src=p.photo;
  loadRank();
}

/* ===== RANK ===== */
function loadRank(){
  rank.innerHTML="";
  users.forEach(u=>{
    const d=document.createElement("div");
    d.className="rank-item";
    d.innerHTML=`<img src="${u.photo}"> ${u.name}`;
    rank.appendChild(d);
  });
}

/* ===== LINKS ===== */
function addLink(){
  if(!profile) return alert("Crie um perfil primeiro");

  const name=dinoName.value;
  const link=linkInput.value;

  if(!name || !link) return alert("Preencha tudo");

  if(!isValidStoreLink(link)){
    alert("❌ Link bloqueado.\nA IA só aceita links de lojas de compra.");
    return;
  }

  links.push({owner:profile.name,name,link});
  localStorage.setItem("links",JSON.stringify(links));
  dinoName.value="";
  linkInput.value="";
  showMyLinks();
  alert("✅ Link aprovado pela IA!");
}

function showMyLinks(){
  myLinks.innerHTML="";
  links.filter(l=>profile && l.owner===profile.name)
    .forEach(l=>{
      const li=document.createElement("li");
      li.innerHTML=`<strong>${l.name}</strong>: <a href="${l.link}" target="_blank">${l.link}</a>`;
      myLinks.appendChild(li);
    });
}

/* ===== PESQUISA GLOBAL ===== */
function searchGlobal(){
  const q=search.value.toLowerCase();
  const res=links.filter(l=>l.name.toLowerCase().includes(q));
  if(q.length>2){
    alert(res.map(r=>r.name+" → "+r.link).join("\n") || "Nada encontrado");
  }
}

/* ===== CONFIG ===== */
function toggleTheme(){
  document.body.classList.toggle("light");
}
function resetData(){
  if(confirm("Apagar tudo?")){
    localStorage.clear();
    location.reload();
  }
}

/* ===== INIT ===== */
if(profile){
  profileImg.src=profile.photo;
  showMyLinks();
}
loadRank();
</script>

</body>
</html>
