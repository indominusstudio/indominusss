<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Indominus Promo</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

nav {
  background: #1c1c1c;
  padding: 10px;
  display: flex;
  justify-content: space-around;
}

nav button {
  background: none;
  border: none;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

header {
  padding: 15px;
  display: flex;
  gap: 10px;
}

input {
  padding: 8px;
  border-radius: 6px;
  border: none;
}

.section {
  display: none;
  padding: 20px;
}

.section.active {
  display: block;
}

.card {
  background: #222;
  padding: 15px;
  border-radius: 10px;
}

.perfil {
  background: #333;
  padding: 8px;
  border-radius: 6px;
  margin-top: 5px;
}

a {
  color: #4da6ff;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- MENU -->
<nav>
  <button onclick="mostrar('inicio')">🏠 Início</button>
  <button onclick="mostrar('loja')">🛒 Loja</button>
  <button onclick="mostrar('perfil')">👤 Perfil</button>
  <button onclick="mostrar('config')">⚙️ Config</button>
</nav>

<!-- INÍCIO -->
<div id="inicio" class="section active">
  <header>
    <input placeholder="Pesquisar dinossauro 🦖">
    <input id="pesquisaPerfil" placeholder="Pesquisar perfil 👤" onkeyup="filtrarPerfis()">
  </header>

  <h2>🦕 Mosassauro em destaque</h2>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Mosasaurus_hoffmannii_skeleton.jpg" width="250"><br><br>
    <a href="https://shopee.com.br/Dinossauro-Brinquedo-Mosassauro-Infantil-Dino-Mossassauro-Vinil-Macio-Menino-Menina-30-cm-i.1588658960.22398747182" target="_blank">
      🔗 Ir para a loja
    </a>
    <p>Esse é o mosassauro que eu comprei</p>
  </div>

  <h2>🏆 Ranking</h2>
  <div id="listaPerfis">
    <div class="perfil">IndominusStudio</div>
    <div class="perfil">DinoKing</div>
    <div class="perfil">MosassauroBR</div>
  </div>
</div>

<!-- LOJA -->
<div id="loja" class="section">
  <h2>🛒 Loja</h2>
  <p>Aqui os usuários vão adicionar links de compra.</p>
</div>

<!-- PERFIL -->
<div id="perfil" class="section">
  <h2>👤 Perfil</h2>
  <p>Foto, nome e links do usuário.</p>
</div>

<!-- CONFIG -->
<div id="config" class="section">
  <h2>⚙️ Configurações</h2>
  <p>Modo claro/escuro, editar perfil, etc.</p>
</div>

<script>
function mostrar(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function filtrarPerfis() {
  let filtro = document.getElementById("pesquisaPerfil").value.toLowerCase();
  let perfis = document.getElementsByClassName("perfil");
  for (let p of perfis) {
    p.style.display = p.innerText.toLowerCase().includes(filtro) ? "block" : "none";
  }
}
</script>

</body>
</html>
