<script>
const allowedStores=["shopee.","amazon.","mercadolivre.","aliexpress.","magazineluiza."];

let profile = JSON.parse(localStorage.getItem("profile")||"null");
let users = JSON.parse(localStorage.getItem("users")||"[]");
let links = JSON.parse(localStorage.getItem("links")||"[]");
let currentViewProfile=null;

/* NAVEGAÇÃO */
function show(id){
  ["home","loja","perfil","config","viewProfile"].forEach(s=>{
    const el=document.getElementById(s);
    if(el) el.classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

/* PERFIL */
function saveProfile(){
  const name=nameInput.value.trim();
  const file=photoFile.files[0];
  if(!name) return alert("Digite um nome");

  const save=(photo)=>{
    profile={name,photo};
    localStorage.setItem("profile",JSON.stringify(profile));

    const i=users.findIndex(u=>u.name===name);
    if(i>=0) users[i]=profile;
    else users.push(profile);

    localStorage.setItem("users",JSON.stringify(users));
    profileImg.src=photo;
    loadRank();
    showMyLinks();
    alert("Perfil salvo!");
  };

  if(file){
    const r=new FileReader();
    r.onload=()=>save(r.result);
    r.readAsDataURL(file);
  }else{
    save("default-profile.png");
  }
}

/* RANK */
function loadRank(){
  rank.innerHTML="";
  users.forEach(u=>{
    const d=document.createElement("div");
    d.className="rank-item";
    d.innerHTML=`
      <img src="${u.photo}">
      <a href="#" onclick="openProfile('${u.name}')">${u.name}</a>
    `;
    rank.appendChild(d);
  });
}

/* PERFIL PÚBLICO (TIPO YT) */
function openProfile(name){
  const u=users.find(x=>x.name===name);
  if(!u) return;
  currentViewProfile=name;

  viewPhoto.src=u.photo;
  viewName.textContent=u.name;

  viewLinks.innerHTML="";
  links.filter(l=>l.owner===name).forEach(l=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${l.link}" target="_blank">${l.name}</a>`;
    viewLinks.appendChild(li);
  });

  show("viewProfile");
}

/* LINKS */
function isValidStoreLink(l){
  return allowedStores.some(s=>l.includes(s));
}

function addLink(){
  if(!profile) return alert("Crie um perfil primeiro");
  const name=dinoName.value;
  const link=linkInput.value;
  if(!name||!link) return alert("Preencha tudo");

  if(!isValidStoreLink(link)){
    alert("❌ Apenas links de lojas!");
    return;
  }

  links.push({owner:profile.name,name,link});
  localStorage.setItem("links",JSON.stringify(links));
  dinoName.value="";
  linkInput.value="";
  showMyLinks();
}

function showMyLinks(){
  myLinks.innerHTML="";
  if(!profile) return;
  links.filter(l=>l.owner===profile.name).forEach(l=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${l.link}" target="_blank">${l.name}</a>`;
    myLinks.appendChild(li);
  });
}

/* CONFIG */
function toggleTheme(){
  document.body.classList.toggle("light");
}

function resetData(){
  if(confirm("Apagar tudo?")){
    localStorage.clear();
    location.reload();
  }
}

/* INIT */
if(profile){
  profileImg.src=profile.photo;
  showMyLinks();
}
loadRank();
</script>
