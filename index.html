<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Indominus Promo</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

nav {
  background: #1c1c1c;
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.menu button {
  background: none;
  border: none;
  color: white;
  font-size: 18px;
  cursor: pointer;
  margin-right: 12px;
}

.menu button:hover {
  color: #4da6ff;
}

.perfil-topo img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #4da6ff;
  cursor: pointer;
}

.section {
  display: none;
  padding: 20px;
}

.section.active {
  display: block;
}

.card {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  max-width: 320px;
}

.rank-item {
  background: #222;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 8px;
}

a {
  color: #4da6ff;
  text-decoration: none;
}

input {
  padding: 8px;
  border-radius: 6px;
  border: none;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- TOPO -->
<nav>
  <div class="menu">
    <button onclick="abrir('inicio')">🏠</button>
    <button onclick="abrir('loja')">🛒</button>
    <button onclick="abrir('rank')">🏆</button>
    <button onclick="abrir('perfil')">👤</button>
  </div>

  <div class="perfil-topo" onclick="abrir('perfil')">
    <img id="fotoTopo" src="https://i.imgur.com/Qq9Yp9N.png">
  </div>
</nav>

<!-- INÍCIO -->
<div id="inicio" class="section active">
  <h2>🦖 Indominus Promo</h2>
  <p>Promoções de dinossauros, perfis e ranking.</p>
</div>

<!-- LOJA -->
<div id="loja" class="section">
  <h2>🦕 Mosassauro em destaque</h2>

  <div class="card">
    <img src="https://i.imgur.com/2yaf2wb.png" width="100%">
    <p>Esse é o mosassauro que eu comprei</p>

    <a href="https://shopee.com.br/Dinossauro-Brinquedo-Mosassauro-Infantil-Dino-Mossassauro-Vinil-Macio-Menino-Menina-30-cm-i.1588658960.22398747182"
       target="_blank">
      🔗 IR PARA A LOJA
    </a>
  </div>
</div>

<!-- RANK -->
<div id="rank" class="section">
  <h2>🏆 Ranking</h2>

  <div class="rank-item">🥇 IndominusStudio</div>
  <div class="rank-item">🥈 DinoKing</div>
  <div class="rank-item">🥉 MosassauroBR</div>
</div>

<!-- PERFIL -->
<div id="perfil" class="section">
  <h2>👤 Meu Perfil</h2>

  <img id="fotoPerfil"
       src="https://i.imgur.com/Qq9Yp9N.png"
       width="110"
       style="border-radius:50%;border:3px solid #4da6ff;"><br>

  <input type="file" accept="image/*" onchange="trocarFoto(event)">
</div>

<script>
function abrir(id) {
  document.querySelectorAll('.section')
    .forEach(s => s.classList.remove('active'));

  document.getElementById(id).classList.add('active');
}

function trocarFoto(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("fotoPerfil").src = e.target.result;
    document.getElementById("fotoTopo").src = e.target.result;
  };
  reader.readAsDataURL(file);
}
</script>

</body>
</html>
