<script>
function mostrar(id) {
  document.querySelectorAll('.section').forEach(sec => {
    sec.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

document.getElementById("btnInicio").addEventListener("click", () => mostrar("inicio"));
document.getElementById("btnLoja").addEventListener("click", () => mostrar("loja"));
document.getElementById("btnPerfil").addEventListener("click", () => mostrar("perfil"));
document.getElementById("btnConfig").addEventListener("click", () => mostrar("config"));
</script>
