<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dino Promo Shopee</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
}
.light {
  background: #f8fafc;
  color: #020617;
}
header {
  background: #16a34a;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
button {
  cursor: pointer;
  padding: 8px 12px;
}
section {
  padding: 20px;
}
.card {
  background: #020617;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}
.light .card {
  background: white;
}
.hidden {
  display: none;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.rank-item img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}
.profile-img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
}
</style>
</head>

<body>

<header>
  <strong>🦖 Dino Promo Shopee</strong>
  <div>
    <button onclick="toggleTheme()">🌗</button>
    <button onclick="showLoja()">🛒 Loja</button>
  </div>
</header>

<section id="home">
  <div class="card">
    <h2>Bem-vindo 👋</h2>
    <p>Promoções de dinossauros da Shopee.</p>
  </div>

  <div class="card">
    <h3>Mosassauro</h3>
    <img src="mosassauro.jpg" width="250">
    <p>Esse é o mosassauro que eu comprei.</p>
  </div>

  <div class="card">
    <h3>🏆 Rank</h3>
    <div id="rank"></div>
  </div>
</section>

<section id="loja" class="hidden">
  <div class="card">
    <h3>Adicionar link</h3>
    <input id="linkInput" placeholder="Cole o link"><br><br>
    <button onclick="addLink()">Salvar link</button>
    <ul id="links"></ul>
  </div>

  <div class="card">
    <h3>Perfil</h3>
    <img id="profileImg" src="default-profile.png" class="profile-img"><br><br>
    <input id="nameInput" placeholder="Seu nome"><br><br>
    <button onclick="saveProfile()">Salvar perfil</button>
  </div>
</section>

<script>
let users = JSON.parse(localStorage.getItem("users") || "[]");

function showLoja(){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("loja").classList.remove("hidden");
}

function saveProfile(){
  const name = document.getElementById("nameInput").value;
  if(!name) return alert("Digite um nome");
  users.push({name:name});
  localStorage.setItem("users", JSON.stringify(users));
  loadRank();
  alert("Perfil salvo!");
}

function loadRank(){
  const r = document.getElementById("rank");
  r.innerHTML = "";
  users.forEach(u=>{
    const div = document.createElement("div");
    div.className = "rank-item";
    div.innerHTML = `<img src="default-profile.png"> ${u.name}`;
    r.appendChild(div);
  });
}

function addLink(){
  const ul = document.getElementById("links");
  const link = document.getElementById("linkInput").value;
  if(!link) return;
  const li = document.createElement("li");
  li.innerHTML = `<a href="${link}" target="_blank">${link}</a>`;
  ul.appendChild(li);
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

loadRank();
</script>

</body>
</html>
