<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Indominus Promo</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px;
}
header {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
input {
  padding: 8px;
  border-radius: 5px;
  border: none;
}
.section {
  margin-top: 30px;
}
.card {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  margin-top: 10px;
}
.perfil {
  padding: 8px;
  background: #333;
  margin-top: 5px;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
  <input placeholder="Pesquisar dinossauro 🦖">
  <input id="pesquisaPerfil" placeholder="Pesquisar perfil 👤" onkeyup="filtrarPerfis()">
</header>

<div class="section">
  <h2>🦕 Mosassauro em destaque</h2>
  <div class="card">
    <img src="mosassauro.jpg" width="200"><br>
    <button>Ir para loja</button>
  </div>
</div>

<div class="section">
  <h2>🏆 Ranking</h2>
  <div id="listaPerfis">
    <div class="perfil">IndominusStudio</div>
    <div class="perfil">DinoKing</div>
    <div class="perfil">MosassauroBR</div>
  </div>
</div>

<script>
function filtrarPerfis() {
  let filtro = document.getElementById("pesquisaPerfil").value.toLowerCase();
  let perfis = document.getElementsByClassName("perfil");
  for (let p of perfis) {
    p.style.display = p.innerText.toLowerCase().includes(filtro) ? "block" : "none";
  }
}
</script>

</body>
</html>
