<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dino Promo Shopee</title>

<style>
:root {
  --bg:#f5f5f5;
  --text:#111;
  --card:white;
}
body.dark {
  --bg:#111;
  --text:#eee;
  --card:#1e1e1e;
}
body {
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}
header {
  background:#00ff88;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.container { padding:20px; }
.card {
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}
.btn-loja {
  position:fixed;
  top:15px;
  right:15px;
  background:#00ff88;
  padding:10px 15px;
  border-radius:20px;
  color:black;
  text-decoration:none;
  font-weight:bold;
}
.anuncio {
  display:flex;
  gap:20px;
  align-items:center;
}
.anuncio img {
  width:220px;
  border-radius:10px;
}
.profile {
  display:flex;
  gap:15px;
  align-items:center;
}
.profile img {
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
}
.rank-item {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
}
.rank-item img {
  width:40px;
  height:40px;
  border-radius:50%;
}
</style>
</head>

<body>

<header>
  <strong>🦖 Dino Promo Shopee</strong>
  <button onclick="toggleTheme()">🌗</button>
</header>

<a href="#loja" class="btn-loja">🛒 Loja</a>

<div class="container">

<!-- TELA INICIAL -->
<div class="card">
  <h2>Bem-vindo 👋</h2>
  <p>
    Aqui você encontra promos de dinossauros da Shopee.
    Clique em <strong>Loja</strong> para criar seu perfil e salvar links 🦕
  </p>
</div>

<!-- MOSASSAURO -->
<div class="card anuncio">
  <div>
    <h3>Mosassauro 🦖</h3>
    <p>O dinossauro marinho mais insano</p>
    <a target="_blank"
      href="https://shopee.com.br/Dinossauro-Brinquedo-Mosassauro-Infantil-Dino-Mossassauro-Vinil-Macio-Menino-Menina-30-cm-i.1588658960.22398747182">
      Ver na Shopee
    </a>
  </div>
  <img src="mosassauro.jpg">
</div>

<!-- RANK -->
<div class="card">
  <h3>🔥 Rank</h3>
  <div id="rank"></div>
</div>

<!-- LOJA -->
<div class="card" id="loja">
  <h3>🛒 Loja</h3>

  <input id="novoLink" placeholder="Cole link da Shopee ou vídeo">
  <button onclick="salvarLink()">Salvar Link</button>

  <ul id="listaLinks"></ul>

  <hr>

  <!-- PERFIL (embaixo da loja) -->
  <h3>👤 Seu Perfil</h3>
  <div class="profile">
    <img id="fotoPerfil" src="default-profile.png">
    <div>
      <input id="nomePerfil" placeholder="Seu nome"><br><br>
      <input type="file" id="inputFoto"><br><br>
      <button onclick="salvarPerfil()">Salvar Perfil</button>
    </div>
  </div>
</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle("dark");
}

/* PERFIL */
function salvarPerfil() {
  const nome = document.getElementById("nomePerfil").value;
  if (!nome) return alert("Digite um nome");

  let usuarios = JSON.parse(localStorage.getItem("usuarios")) || {};

  const file = document.getElementById("inputFoto").files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      usuarios[nome] = reader.result;
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      carregarRank();
      document.getElementById("fotoPerfil").src = reader.result;
    };
    reader.readAsDataURL(file);
  } else {
    usuarios[nome] = "default-profile.png";
    localStorage.setItem("usuarios", JSON.stringify(usuarios));
    carregarRank();
  }
}

/* LINKS */
function salvarLink() {
  let links = JSON.parse(localStorage.getItem("links")) || [];
  const link = document.getElementById("novoLink").value;
  links.push(link);
  localStorage.setItem("links", JSON.stringify(links));
  mostrarLinks();
}

function mostrarLinks() {
  const ul = document.getElementById("listaLinks");
  ul.innerHTML = "";
  let links = JSON.parse(localStorage.getItem("links")) || [];
  links.forEach(l => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${l}" target="_blank">${l}</a>`;
    ul.appendChild(li);
  });
}

/* RANK REAL */
function carregarRank() {
  const rank = document.getElementById("rank");
  rank.innerHTML = "";
  let usuarios = JSON.parse(localStorage.getItem("usuarios")) || {};
  Object.keys(usuarios).forEach(nome => {
    const div = document.createElement("div");
    div.className = "rank-item";
    div.innerHTML = `
      <img src="${usuarios[nome]}">
      <span>${nome}</span>
    `;
    rank.appendChild(div);
  });
}

mostrarLinks();
carregarRank();
</script>

<footer style="text-align:center;padding:10px;">
  © 2026 – Dino Promo Shopee
</footer>

</body>
</html>
