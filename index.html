<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dino Promo Shopee</title>

<style>
:root {
  --bg: #f5f5f5;
  --text: #111;
  --card: white;
}

body.dark {
  --bg: #111;
  --text: #eee;
  --card: #1e1e1e;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 15px;
  background: #00ff88;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  cursor: pointer;
}

.container {
  padding: 20px;
}

.card {
  background: var(--card);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

/* botão loja */
.btn-loja {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #00ff88;
  padding: 10px 15px;
  border-radius: 20px;
  text-decoration: none;
  color: black;
  font-weight: bold;
}

/* perfil */
.profile {
  display: flex;
  gap: 15px;
  align-items: center;
}

.profile img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
}

/* anuncio */
.anuncio {
  display: flex;
  gap: 20px;
  align-items: center;
}

.anuncio img {
  width: 200px;
  border-radius: 10px;
}

/* rank */
.rank-item {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
